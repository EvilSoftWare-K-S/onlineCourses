<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>Card catalog | Courses and trainings</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Lusitana:wght@400;700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <img class="dots" src="./src/icons/dots.svg" alt="background-dots" />
    <img
      class="shapes1"
      src="./src/icons/shapes1.svg"
      alt="background-shapes1"
    />
    <img
      class="shapes2"
      src="./src/icons/shapes2.svg"
      alt="background-shapes2"
    />

    <div class="wrappage">
      <div class="page">
        <header class="catalog__header">
          <h1 class="catalog__title_h1">Our online courses</h1>
          <h6 class="catalog__title_h6">Enjoy your studying!</h6>
          
        </header>
        <aside class="controls">
          <div class="filters">
            <div class="filters__list" id="filtersContainer"></div>
          </div>
          <div class="search">
            <input
              type="text"
              class="search__field"
              id="searchInput"
              placeholder="Search course..."
              aria-label="Search"
            />
            <img
              src="./src/icons/search.svg"
              class="search__icon"
              alt="search__icon"
            />
          </div>
        </aside>

        <div id="cardsContainer" class="cards"></div>
      </div>
    </div>

    <script type="module" src="./scripts.js"></script>
  </body>
</html>
